name: 计算或运行问题
description: 提供最小输入与完整单位，便于重现问题。
labels: [bug]
body:
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: Python、NumPy、SciPy、Matplotlib版本及操作系统。
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: 最小可复现输入
      description: 提供JSON或Python片段，并明确长度、角度、力和扭矩单位。
      render: python
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果或完整错误
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果与依据
      description: 说明解析解、公开公式、数值基准或试验边界。
    validations:
      required: true
